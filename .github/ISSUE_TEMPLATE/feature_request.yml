name: Solicitar una mejora
description: Proponer una función o mejora para el proyecto
title: "[Mejora]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema u oportunidad
      description: ¿Qué necesidad debería resolver esta mejora?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Solución propuesta
      description: Describe el resultado deseado.
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: Valor para usuarios o negocio
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Criterios de aceptación
      description: ¿Cómo sabremos que la mejora está terminada?
